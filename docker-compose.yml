services:
  # ---- Your private site (the only service exposed) ----
  web:
    build: .
    container_name: manga-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      DATABASE_URL: file:/data/app.db
      SUWAYOMI_URL: http://suwayomi:4567
      # Solver pool, one engine. trawl escalates HTTP -> cached session (Redis)
      # -> Camoufox browser -> residential proxy, so most hosts never pay for a
      # browser boot at all.
      SOLVERS: ${SOLVERS:-trawl@http://trawl:8191}
      # Shared secret in the path of the solver facade Suwayomi calls.
      SOLVER_PROXY_TOKEN: ${SOLVER_PROXY_TOKEN:?set SOLVER_PROXY_TOKEN in .env}
      # Uploaded avatars/banners live on the mounted data volume.
      UPLOAD_DIR: /data/uploads
      # Chapter pages are immutable, so they are served from disk after the
      # first fetch. Sized for the local server, not a VPS.
      IMAGE_CACHE_DIR: /data/imgcache
      IMAGE_CACHE_DISK_MB: ${IMAGE_CACHE_DISK_MB:-8192}
      IMAGE_CACHE_MEM_MB: ${IMAGE_CACHE_MEM_MB:-512}
      # Each concurrent solve is one browser context, so this matches
      # trawl's own BROWSER_POOL_SIZE.
      FLARE_CONCURRENCY: ${FLARE_CONCURRENCY:-2}
      FLARE_MAX_QUEUE: ${FLARE_MAX_QUEUE:-8}
      # Always behind the Cloudflare Tunnel, so HTTPS is terminated in front.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # /info panel: host counters come from the mounted procfs, container stats
      # and logs from the read-only socket proxy.
      HOST_PROC: /host/proc
      DOCKER_API_URL: http://dockerproxy:2375
    volumes:
      - ./data:/data
      # Read-only, only so the panel can size the download folder.
      - ./suwayomi:/suwayomi:ro
      # Host CPU/RAM/network/pressure counters for /info.
      - /proc:/host/proc:ro
    ports:
      # Host port is only for local checks; the tunnel reaches web:3000 internally.
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - suwayomi
      - dockerproxy
      - trawl
    networks:
      - manga

  # ---- Cloudflare Tunnel: publishes only the web app (reader subdomain) ----
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # Opt-in: `docker compose --profile tunnel up -d` starts the tunnel.
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - web
    networks:
      - manga

  # ---- Suwayomi engine: scrapes sources, downloads chapters (internal only) ----
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi-server
    restart: unless-stopped
    # Bound to localhost only: lets you reach Suwayomi's own admin WebUI at
    # http://localhost:4567 (install extensions / add sources) and run the
    # host dev server. It is NOT reachable from the LAN/internet. Remove this
    # block entirely for strict isolation (manage sources via the app instead).
    ports:
      - "127.0.0.1:4567:4567"
    environment:
      TZ: America/Sao_Paulo
      BIND_IP: "0.0.0.0"
      BIND_PORT: "4567"
      AUTH_MODE: "none"
      DOWNLOAD_AS_CBZ: "true"
      # Downloads are triggered per-chapter from the app. Flip to "true" to also
      # auto-download new chapters of followed titles.
      AUTO_DOWNLOAD_CHAPTERS: "false"
      AUTO_DOWNLOAD_NEW_CHAPTERS_LIMIT: "0"
      # Extension repos (JSON array). Keiyoushi is the default and already bundles
      # hundreds of sources across languages, including English and pt-BR. Override
      # EXTENSION_REPOS in .env to add more repos. v2.3.x uses EXTENSION_STORES;
      # older builds use EXTENSION_REPOS. Setting both is harmless.
      EXTENSION_STORES: '${EXTENSION_REPOS:-["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]}'
      EXTENSION_REPOS: '${EXTENSION_REPOS:-["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]}'
      # Routed through the app's facade rather than pointing at trawl directly,
      # so the engine gets the facade's fallback behavior.
      FLARESOLVERR_ENABLED: "${FLARESOLVERR_ENABLED:-true}"
      FLARESOLVERR_URL: "http://web:3000/api/solver/${SOLVER_PROXY_TOKEN:?set SOLVER_PROXY_TOKEN in .env}"
      FLARESOLVERR_TIMEOUT: "60"
      FLARESOLVERR_SESSION_NAME: "suwayomi"
      FLARESOLVERR_SESSION_TTL: "15"
      FLARESOLVERR_RESPONSE_AS_FALLBACK: "${FLARESOLVERR_RESPONSE_AS_FALLBACK:-true}"
    volumes:
      # Order matters: downloads must be mounted before the data dir.
      - ./suwayomi/downloads:/home/suwayomi/.local/share/Tachidesk/downloads
      - ./suwayomi/data:/home/suwayomi/.local/share/Tachidesk
    networks:
      - manga

  # ---- Session cache for trawl. A repeat request to the same host replays in
  #      ~500ms off cached cookies instead of booting a browser. No volume:
  #      the session cookie is disposable, so persisting it to disk would only
  #      be overlay writes for nothing. ----
  redis:
    image: redis:8-alpine
    container_name: manga-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    mem_limit: ${REDIS_MEM:-128m}
    networks:
      - manga

  # ---- Only challenge solver: escalates HTTP -> cached session (Redis) ->
  #      Camoufox browser -> residential proxy, so most hosts never pay for a
  #      browser boot at all. Speaks the FlareSolverr-shaped /v1 endpoint and
  #      answers both request.get and request.post. ----
  trawl:
    image: ghcr.io/germondai/trawl:latest
    container_name: trawl
    restart: unless-stopped
    # Without this, Camoufox/Firefox dies with a multiprocessing.synchronize
    # error on OCI/LXC hosts.
    shm_size: 1gb
    depends_on:
      - redis
    environment:
      TZ: America/Sao_Paulo
      REDIS_URL: redis://redis:6379
      # Warm browsers; the real RAM knob.
      BROWSER_POOL_SIZE: ${TRAWL_POOL_SIZE:-2}
      BROWSER_CONTENT_PROCESSES: "2"
      BROWSER_RECYCLE_AFTER_CONTEXTS: "8"
      SESSION_TTL_SECONDS: ${TRAWL_SESSION_TTL:-3600}
      # Level 3 (datacenter) and level 4 (residential) proxies, empty by
      # default. The VPS's own IP is what gets banned; filling these in is the
      # only real fix for that, not a config knob to tune for free.
      PROXY_URL: ${PROXY_URL:-}
      PROXY_LIST_FILE: ${PROXY_LIST_FILE:-}
      RESIDENTIAL_PROXY_URL: ${RESIDENTIAL_PROXY_URL:-}
      RESIDENTIAL_PROXY_LIST_FILE: ${RESIDENTIAL_PROXY_LIST_FILE:-}
      MITM_PROXY_ENABLED: "false"
    expose:
      - "8191"
    # Static status endpoint; it doesn't drive a real browser per check.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: ${TRAWL_MEM:-2048m}
    networks:
      - manga

  # ---- Read-only window into the Docker daemon for the /info panel. Only GET
  #      endpoints are whitelisted, so the app can never drive the daemon even
  #      if it is compromised. Never publish this port. ----
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - manga

networks:
  manga:
    driver: bridge
